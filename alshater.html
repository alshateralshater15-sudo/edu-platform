<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المنصة الشاملة | V17</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
  :root{--primary:#0d6efd;--success:#198754;--danger:#dc3545;--warning:#ffc107;--dark:#1a1d23;--border:#e5e7eb;--shadow:0 4px 20px rgba(0,0,0,.08);--bg:#f0f2f5;--purple:#6c5ce7}
  body{background:var(--bg);color:var(--dark);line-height:1.6}
  button{cursor:pointer;border:none;font-family:inherit}
  .btn{padding:10px 20px;border-radius:8px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:.2s}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-success{background:var(--success);color:#fff}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-sm{padding:6px 12px;font-size:12px}
  .hidden{display:none!important}

  #loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0d6efd,#6c5ce7);padding:20px}
  .login-box{background:#fff;padding:40px;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.2);width:100%;max-width:400px;text-align:center}
  .login-box h2{margin-bottom:25px;color:var(--primary)}
  .form-group{margin-bottom:15px;text-align:right}
  .form-group label{display:block;margin-bottom:6px;font-weight:600;font-size:14px}
  .form-group input{width:100%;padding:10px;border:2px solid var(--border);border-radius:8px;font-size:14px}
  
  #dashboard{display:none;max-width:1200px;margin:0 auto;padding:30px 20px}
  .dash-header{background:#fff;border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
  .tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  .tab-btn{padding:10px 20px;background:#fff;border-radius:10px;font-weight:700;color:#666;box-shadow:var(--shadow);transition:.2s;font-size:14px}
  .tab-btn.active{background:var(--primary);color:#fff}
  .tab-content{display:none}.tab-content.active{display:block}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:20px}
  .stat-card{background:#fff;padding:20px;border-radius:16px;text-align:center;box-shadow:var(--shadow)}
  .stat-card .num{font-size:28px;font-weight:900;color:var(--primary)}
  .card-box{background:#fff;border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .table-wrap{overflow:auto}
  table{width:100%;border-collapse:collapse}
  th,td{padding:12px 14px;text-align:right;border-bottom:1px solid var(--border);font-size:14px;white-space:nowrap}
  th{background:#f8f9fa;font-weight:700;color:#444}
  tr:hover td{background:#f8f9fa}
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center;padding:20px}
  .modal.active{display:flex}
  .modal-content{background:#fff;border-radius:16px;padding:25px;max-width:500px;width:100%;max-height:90vh;overflow:auto}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
  .close-btn{background:none;font-size:26px;color:#999}
  .video-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:15px;border:1px solid var(--border)}
  .video-header{padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);background:#f8f9fa}
  .video-body{padding:15px}
  .video-frame{width:100%;height:250px;border:none;border-radius:8px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--dark);color:#fff;padding:12px 24px;border-radius:10px;font-weight:600;transition:.3s;z-index:2000;opacity:0}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast.success{background:var(--success)}.toast.error{background:var(--danger)}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h2>🔐 تسجيل الدخول</h2>
    <div class="form-group"><label>اسم المستخدم</label><input type="text" id="loginUser"></div>
    <div class="form-group"><label>كلمة المرور</label><input type="password" id="loginPass"></div>
    <button class="btn btn-primary" onclick="doLogin()" style="width:100%;padding:12px;">دخول</button>
    <p style="margin-top:15px;font-size:12px;color:#888;">للدخول كـ مبرمج: admin / 123456</p>
  </div>
</div>

<div id="adminDashboard" style="display:none;max-width:1200px;margin:0 auto;padding:20px;">
  <div class="dash-header" style="background:#1a1d23;color:#fff;">
    <div><h2 style="color:#ffc107;">👑 لوحة المبرمج</h2></div>
    <button class="btn btn-danger btn-sm" onclick="logout()">خروج</button>
  </div>
  <div class="card-box">
    <div style="display:flex;justify-content:space-between;margin-bottom:15px;">
      <h3>قائمة العملاء</h3>
      <button class="btn btn-success btn-sm" onclick="openModal('clientModal')">+ إضافة عميل</button>
    </div>
    <div class="table-wrap">
      <table><thead><tr><th>الاسم</th><th>الباسورد</th><th>إجراءات</th></tr></thead><tbody id="adminClientsTable"></tbody></table>
    </div>
  </div>
</div>

<div id="dashboard">
  <div class="dash-header">
    <div style="display:flex;align-items:center;gap:15px;">
      <div style="width:45px;height:45px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;">🏫</div>
      <div><h2 id="sysTitle">نظام الإدارة</h2></div>
    </div>
    <button class="btn btn-danger btn-sm" onclick="logout()">خروج</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('students',this)">👥 الطلاب</button>
    <button class="tab-btn" onclick="switchTab('videos',this)">🎬 الفيديوهات</button>
  </div>

  <div class="tab-content active" id="tab-students">
    <div class="card-box">
      <button class="btn btn-success btn-sm" onclick="openModal('studentModal')">+ إضافة طالب</button>
      <table style="margin-top:15px;"><thead><tr><th>الاسم</th><th>الباسورد</th><th>إجراء</th></tr></thead><tbody id="studentsTable"></tbody></table>
    </div>
  </div>
  
  <div class="tab-content" id="tab-videos">
    <div class="card-box">
      <button class="btn btn-success btn-sm" onclick="openModal('videoModal')">+ إضافة فيديو</button>
      <div id="videosList" style="margin-top:15px;"></div>
    </div>
  </div>
</div>

<div id="studentDashboard" style="display:none;max-width:1000px;margin:0 auto;padding:30px 20px;">
  <div class="dash-header" style="background:var(--purple);color:#fff;">
    <div><h2 id="stNameTitle">بوابة الطالب</h2></div>
    <button class="btn btn-danger btn-sm" onclick="logout()">خروج</button>
  </div>
  <div class="card-box">
    <h3>🎬 فيديوهاتك</h3>
    <div id="stVideosList"></div>
  </div>
</div>

<div class="modal" id="clientModal">
  <div class="modal-content">
    <div class="modal-header"><h3>➕ إضافة عميل</h3><button class="close-btn" onclick="closeModal('clientModal')">×</button></div>
    <div class="form-group"><label>الاسم</label><input type="text" id="clName"></div>
    <div class="form-group"><label>الباسورد</label><input type="text" id="clPass"></div>
    <button class="btn btn-primary" style="width:100%;" onclick="saveClient()">حفظ</button>
  </div>
</div>

<div class="modal" id="studentModal">
  <div class="modal-content">
    <div class="modal-header"><h3>➕ إضافة طالب</h3><button class="close-btn" onclick="closeModal('studentModal')">×</button></div>
    <div class="form-group"><label>اسم الطالب</label><input type="text" id="stName"></div>
    <div class="form-group"><label>الباسورد</label><input type="text" id="stPass" value="123456"></div>
    <button class="btn btn-primary" style="width:100%;" onclick="saveStudent()">حفظ</button>
  </div>
</div>

<div class="modal" id="videoModal">
  <div class="modal-content">
    <div class="modal-header"><h3>🎬 إضافة فيديو</h3><button class="close-btn" onclick="closeModal('videoModal')">×</button></div>
    <div class="form-group"><label>العنوان</label><input type="text" id="vTitle"></div>
    <div class="form-group"><label>رابط يوتيوب</label><input type="url" id="vUrl"></div>
    <button class="btn btn-primary" style="width:100%;" onclick="saveVideo()">حفظ</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // إعدادات قاعدة البيانات (الخاصة بك)
  const SUPABASE_URL = 'https://fozlbjxatzfkfixuaku.supabase.co'; 
  const SUPABASE_KEY = 'sb_publishable_nxwXnh7oc7j2W4xnvaAUGQ_z6qd8_S1Q'; 

  // التحقق من تحميل المكتبة
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const ADMIN_USER = 'admin'; const ADMIN_PASS = '123456';
  let DB = { clients: [], students: [], videos: [] };

  // دالة الدخول (مستقلة عشان تشتغل في كل البيئات)
  async function doLogin() {
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value.trim();
    if(!user || !pass) return toast('أدخل البيانات', 'error');

    try {
      // جلب البيانات من السحابة
      const { data: clients } = await _supabase.from('clients').select('*');
      const { data: students } = await _supabase.from('students').select('*');
      const { data: videos } = await _supabase.from('videos').select('*');
      
      DB.clients = clients || []; DB.students = students || []; DB.videos = videos || [];

      if(user === ADMIN_USER && pass === ADMIN_PASS) { showAdmin(); return; }
      
      const client = DB.clients.find(c => c.name === user && c.pass === pass);
      if(client) { showClient(client); return; }
      
      const student = DB.students.find(s => s.name === user && s.pass === pass);
      if(student) { showStudent(student); return; }
      
      toast('❌ بيانات غير صحيحة', 'error');
    } catch (err) {
      console.error(err);
      toast('⚠️ خطأ في الاتصال بقاعدة البيانات. تأكد من المفتاح.', 'error');
    }
  }

  // دعم زرار Enter
  document.getElementById('loginPass').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') doLogin();
  });

  function logout() { if(confirm('خروج؟')) location.reload(); }
  
  function showAdmin() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminDashboard').style.display = 'block';
    renderAdmin();
  }
  function showClient(c) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('sysTitle').textContent = c.name;
    renderClient();
  }
  function showStudent(s) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('studentDashboard').style.display = 'block';
    document.getElementById('stNameTitle').textContent = 'أهلاً ' + s.name;
    renderStudent();
  }

  function renderAdmin() {
    document.getElementById('adminClientsTable').innerHTML = DB.clients.map(c => 
      `<tr><td>${c.name}</td><td>${c.pass}</td><td><button class="btn btn-danger btn-sm" onclick="delClient(${c.id})">حذف</button></td></tr>`
    ).join('');
  }
  function renderClient() {
    document.getElementById('studentsTable').innerHTML = DB.students.map(s => 
      `<tr><td>${s.name}</td><td>${s.pass}</td><td><button class="btn btn-danger btn-sm" onclick="delStudent(${s.id})">حذف</button></td></tr>`
    ).join('');
    document.getElementById('videosList').innerHTML = DB.videos.map(v => renderVideoCard(v, true)).join('');
  }
  function renderStudent() {
    document.getElementById('stVideosList').innerHTML = DB.videos.map(v => renderVideoCard(v, false)).join('');
  }
  function renderVideoCard(v, isAdmin) {
    let embed = v.url;
    if(v.url.includes('youtube.com/watch?v=')) embed = v.url.replace('watch?v=', 'embed/');
    if(v.url.includes('youtu.be/')) embed = 'https://www.youtube.com/embed/' + v.url.split('youtu.be/')[1];
    return `<div class="video-card"><div class="video-header"><strong>${v.title}</strong>${isAdmin ? `<button class="btn btn-danger btn-sm" onclick="delVideo(${v.id})">حذف</button>` : ''}</div>
      <div class="video-body"><iframe src="${embed}" class="video-frame" allowfullscreen></iframe></div></div>`;
  }

  async function saveClient() {
    const name = document.getElementById('clName').value.trim();
    const pass = document.getElementById('clPass').value.trim();
    await _supabase.from('clients').insert([{ name, pass }]);
    DB.clients = (await _supabase.from('clients').select('*')).data;
    closeModal('clientModal'); renderAdmin(); toast('✅ تم الإضافة', 'success');
  }
  async function saveStudent() {
    const name = document.getElementById('stName').value.trim();
    const pass = document.getElementById('stPass').value.trim();
    await _supabase.from('students').insert([{ name, pass }]);
    DB.students = (await _supabase.from('students').select('*')).data;
    closeModal('studentModal'); renderClient(); toast('✅ تم الإضافة', 'success');
  }
  async function saveVideo() {
    const title = document.getElementById('vTitle').value.trim();
    const url = document.getElementById('vUrl').value.trim();
    await _supabase.from('videos').insert([{ title, url }]);
    DB.videos = (await _supabase.from('videos').select('*')).data;
    closeModal('videoModal'); renderClient(); toast('✅ تم الإضافة', 'success');
  }

  async function delClient(id) { if(!confirm('حذف؟')) return; await _supabase.from('clients').delete().eq('id', id); DB.clients = DB.clients.filter(x=>x.id!==id); renderAdmin(); }
  async function delStudent(id) { if(!confirm('حذف؟')) return; await _supabase.from('students').delete().eq('id', id); DB.students = DB.students.filter(x=>x.id!==id); renderClient(); }
  async function delVideo(id) { if(!confirm('حذف؟')) return; await _supabase.from('videos').delete().eq('id', id); DB.videos = DB.videos.filter(x=>x.id!==id); renderClient(); }

  function switchTab(tab, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    if(btn) btn.classList.add('active');
  }
  function openModal(id) { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  function toast(msg, type) {
    const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show ' + type;
    setTimeout(() => t.className = 'toast ' + type, 3000);
  }
</script>
</body>
</html>
